name: 333 Network Topology and Identity Boundary Audit
# Manual-only, source-contract checks. No STOS or OHMIC network connection.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4

      - name: Run topology contracts (stdlib)
        run: python3 -m unittest discover -s tests -p 'test_topology_contract.py' -v

      - name: Run identity boundary contracts (stdlib)
        run: python3 -m unittest discover -s tests -p 'test_identity_boundaries.py' -v

      - name: Run offline and backup boundary contracts (stdlib)
        run: python3 -m unittest discover -s tests -p 'test_offline_backup_boundaries.py' -v

      - name: Exercise service-worker cache policy (Node.js)
        run: node --test tests/service_worker_policy.test.mjs

      - name: Exercise HOLLO backup rollback and local media boundaries (Node.js)
        run: node --test tests/hollo_hardening.test.mjs

      - name: Exercise HOLLO D09 three-bubble safety regressions (Node.js)
        run: node --test tests/hollo_three_bubbles.test.mjs

      - name: Verify HOLLO canonical blueprint chrome and layout rail (Node.js)
        run: node --test tests/hollo_blueprint_chrome.test.mjs

      - name: Verify KANSEE backup, local identity, media and shared chrome (Node.js)
        run: node --test tests/kansee_hardening.test.mjs

      - name: Verify KANSEE conference gallery and visual blueprint (Node.js)
        run: node --test tests/kansee_gallery_layout.test.mjs

      - name: Verify KANSEE Focus Mode and meeting-first layout (Node.js)
        run: node --test tests/kansee_focus_mode.test.mjs

      - name: Verify E=Ven Mail canonical blueprint and mailbox preservation (Node.js)
        run: node --test tests/even_mail_blueprint.test.mjs
