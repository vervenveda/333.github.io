[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network333-backend"
version = "0.2.0"
description = "Shared backend foundation for HOLLO, KANSEE, E=Ven Mail, Bazaar Art Live, SIte, and Bunya."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — see repository terms" }
authors = [
  { name = "Jennifer Kay Pearl" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "argon2-cffi>=23.1,<26.0",
  "python-multipart>=0.0.9,<1.0",
  "email-validator>=2.2,<3.0",
  "redis>=5,<7",
  "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-redis>=4.6,<5.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
